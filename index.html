    <title>CareerX — From Campus to Career | AI Career Operating System</title>
    <style>
      /* Pre-hydration splash: avoids a white flash and shows the brand instantly. */
      html { background: #070a18; }
      html.light { background: #f6f8fc; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: #070a18; z-index: 9999; transition: opacity .4s ease;
        font-family: Sora, Inter, system-ui, sans-serif;
      }
      html.light #boot { background: #f6f8fc; }
      #boot .bx { width: 54px; height: 54px; border-radius: 16px; border: 2px solid rgba(139,92,246,.35);
        border-top-color: #8b5cf6; animation: bspin 1s linear infinite; }
      #boot p { margin-top: 18px; color: #94a3b8; font-size: 13px; letter-spacing: .18em; text-transform: uppercase; }
      html.light #boot p { color: #64748b; }
      @keyframes bspin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="boot"><div style="text-align:center"><div class="bx" style="margin:0 auto"></div><p>CareerX</p></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
